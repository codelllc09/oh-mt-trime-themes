# 從 V1 繼承版面與動作，由 tools/gen_halftone.py 生成主題及鍵帽。
name: V2-halftone
style:
  color_scheme: halftone_print
  background_folder: v2-halftone
  latin_font: [halftone_latin.ttf, xuma_latin.ttf]
  key_text_size: 21
  key_long_text_size: 13
  symbol_text_size: 9
  round_corner: 4
  candidate_corner_radius: 8

