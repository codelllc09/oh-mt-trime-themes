# tools/check_trime.py gen-theme --theme v2-pixelblock 將跨鍵色塊套在 V1 鍵位上。
name: V2-pixelblock
style:
  color_scheme: pixelblock_arcade
  background_folder: v2-pixelblock
  latin_font: [labelmaker_mono.otf, xuma_latin.ttf]
  horizontal_gap: 0
  candidate_view_height: 43
  comment_height: 0
  candidate_corner_radius: 0
  candidate_padding: 7
  key_text_size: 21
  key_long_text_size: 12
  symbol_text_size: 9
  round_corner: 0

preset_color_schemes:
  pixelblock_arcade:
    name: 藍紫像素
    back_color: '#FF242682'
    root_background: '#FF343BD5'
