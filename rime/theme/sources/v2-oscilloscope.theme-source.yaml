# tools/gen_scope_pixel.py 將示波器外觀套在 V1 鍵位上。
name: V2-oscilloscope
style:
  color_scheme: oscilloscope_phosphor
  background_folder: v2-oscilloscope
  latin_font: [labelmaker_mono.otf, xuma_latin.ttf]
  candidate_view_height: 43
  comment_height: 0
  candidate_corner_radius: 1
  candidate_padding: 7
  key_text_size: 21
  key_long_text_size: 12
  symbol_text_size: 9
  round_corner: 1

