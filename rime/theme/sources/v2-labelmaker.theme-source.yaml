# 從 V1 繼承版面與動作，由 tools/check_trime.py gen-theme --theme v2-labelmaker 生成主題及資產。
name: V2-labelmaker
style:
  color_scheme: labelmaker_tape
  background_folder: v2-labelmaker
  latin_font: [labelmaker_mono.otf, xuma_latin.ttf]
  candidate_view_height: 42
  comment_height: 0
  candidate_padding: 8
  candidate_corner_radius: 1
  key_text_size: 20
  key_long_text_size: 12
  symbol_text_size: 9
  round_corner: 4

preset_keys:
  Mode_switch:
    label: 中／英
    states: [中／英, 中／英]

preset_color_schemes:
  labelmaker_tape:
    name: 石墨灰紙帶
    back_color: '#FFF5EBD5'
    root_background: '#FF30352F'
    keyboard_background: case.png
