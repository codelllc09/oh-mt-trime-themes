# V2 外觀覆寫。tools/gen_typewriter.py 從展開後的 V1 繼承所有鍵位與動作。
name: V2-typewriter
style:
  color_scheme: typewriter_ink
  background_folder: v2-typewriter
  latin_font: [typewriter_latin.ttf, xuma_latin.ttf]
  key_text_size: 16
  key_long_text_size: 11
  symbol_text_size: 8
  round_corner: 8

