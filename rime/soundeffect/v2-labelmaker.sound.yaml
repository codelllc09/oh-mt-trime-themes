# 定案試聽的合成音效，由 tools/gen_labelmaker.py 提取 WAV。
name: V2-labelmaker
folder: v2-labelmaker
sound:
  - glyph-1.wav
  - glyph-2.wav
  - glyph-3.wav
  - space-1.wav
  - erase-1.wav
  - control-1.wav
  - return-1.wav
keyset:
  - {keys: [KEYCODE_ENTER, KEYCODE_NUMPAD_ENTER], inOrder: true, sounds: [6]}
  - {keys: [KEYCODE_SPACE], inOrder: true, sounds: [3]}
  - {keys: [KEYCODE_DEL, KEYCODE_FORWARD_DEL], inOrder: true, sounds: [4]}
  - keys: [KEYCODE_SHIFT_LEFT, KEYCODE_SHIFT_RIGHT, KEYCODE_SWITCH_CHARSET,
           KEYCODE_LANGUAGE_SWITCH, KEYCODE_EISU, KEYCODE_TAB, KEYCODE_ESCAPE]
    inOrder: true
    sounds: [5]
  - {min: KEYCODE_A, max: KEYCODE_Z, inOrder: false, sounds: [0, 1, 2]}
  - {min: KEYCODE_0, max: KEYCODE_9, inOrder: false, sounds: [0, 1, 2]}
  - keys: [KEYCODE_COMMA, KEYCODE_PERIOD, KEYCODE_SLASH, KEYCODE_SEMICOLON, KEYCODE_APOSTROPHE,
           KEYCODE_MINUS, KEYCODE_EQUALS, KEYCODE_GRAVE, KEYCODE_LEFT_BRACKET, KEYCODE_RIGHT_BRACKET,
           KEYCODE_BACKSLASH]
    inOrder: false
    sounds: [0, 1, 2]
