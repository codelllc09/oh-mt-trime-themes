# 取自定案原型的合成鍵音，布面悶敲，回車稍沉。
name: V2-patchwork
folder: v2-patchwork
sound:
  - glyph-1.wav
  - glyph-2.wav
  - glyph-3.wav
  - glyph-4.wav
  - glyph-5.wav
  - space-1.wav
  - erase-1.wav
  - return-1.wav
keyset:
  - {keys: [KEYCODE_ENTER, KEYCODE_NUMPAD_ENTER], inOrder: true, sounds: [7]}
  - {keys: [KEYCODE_SPACE], inOrder: true, sounds: [5]}
  - {keys: [KEYCODE_DEL, KEYCODE_FORWARD_DEL], inOrder: true, sounds: [6]}
  - {min: KEYCODE_A, max: KEYCODE_Z, inOrder: false, sounds: [0, 1, 2, 3, 4]}
  - {min: KEYCODE_0, max: KEYCODE_9, inOrder: false, sounds: [0, 1, 2, 3, 4]}
  - keys: [KEYCODE_COMMA, KEYCODE_PERIOD, KEYCODE_SLASH, KEYCODE_SEMICOLON, KEYCODE_APOSTROPHE,
           KEYCODE_MINUS, KEYCODE_EQUALS, KEYCODE_GRAVE, KEYCODE_LEFT_BRACKET, KEYCODE_RIGHT_BRACKET,
           KEYCODE_BACKSLASH]
    inOrder: false
    sounds: [0, 1, 2, 3, 4]
