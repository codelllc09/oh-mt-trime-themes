  # ── number_zh：中文標點頁（從數字鍵盤按 CJK 進入）
  #    版面原則：**每行填滿，不留空塊**（用戶裁定 2026-11-06）。
  #    收詞原則：以東亞本土標點與中西共用符號為主，另准收「高頻的全角形 ASCII」
  #    （現收 ，？！：；（）／％＠ —— 中文行文天天用）；個別重複允許。
  #    本頁不翻譯：字符全是非 ASCII，走 commitText 直上屏。
  # ── number_zh：中文標點頁（從數字鍵盤按 CJK 進入）
  #    版面原則：**每行填滿，不留空塊**（用戶裁定 2026-11-06）。
  #    排序原則：**按使用頻率**——句讀與引號佔最上兩行（最好按），
  #    書名號與各式括號次之，低頻的全角形 ASCII（／＼％＠）只在末行補位。
  #    本頁不翻譯：字符全是非 ASCII，走 commitText 直上屏。
  number_zh:
    name: 標點
    author: codelllc09
    ascii_mode: 0
    reset_ascii_mode: true
    width: 10
    height: 38
    lock: true
    keys:
      # 行 1（最高頻）：句讀 ＋ 雙引號
      - {click: '，', key_text_offset_x: 6.1}
      - {click: '。', key_text_offset_x: 8.0}
      - {click: '、'}
      - {click: '？', key_text_offset_x: 5.7}
      - {click: '！', key_text_offset_x: 5.9}
      - {click: '；', key_text_offset_x: 5.7}
      - {click: '：', key_text_offset_x: 5.7}
      - {click: '“', key_text_offset_x: -6.0}
      - {click: '”', key_text_offset_x: 6.0}
      - {click: '·'}
      # 行 2：直角引號、單引號、圓括號
      - {click: '「', key_text_offset_x: -6.6}
      - {click: '」', key_text_offset_x: 6.6}
      - {click: '『', key_text_offset_x: -6.0}
      - {click: '』', key_text_offset_x: 6.0}
      - {click: '‘'}
      - {click: '’'}
      - {click: '（', key_text_offset_x: -7.0}
      - {click: '）', key_text_offset_x: 6.9}
      - {click: '～'}
      - {click: '…'}
      # 行 3：書名號與各式括號
      - {click: '《', key_text_offset_x: -7.6}
      - {click: '》', key_text_offset_x: 7.6}
      - {click: '〈', key_text_offset_x: -8.9}
      - {click: '〉', key_text_offset_x: 8.9}
      - {click: '【', key_text_offset_x: -7.0}
      - {click: '】', key_text_offset_x: 7.0}
      - {click: '〔', key_text_offset_x: -7.5}
      - {click: '〕', key_text_offset_x: 7.5}
      - {click: '〖', key_text_offset_x: -6.6}
      - {click: '〗', key_text_offset_x: 6.6}
      # 行 4：其餘（破折號、乘號、漢字零、低頻全角形；兩端接 ABC 與 ⌫）
      - {click: Keyboard_default, width: 15, label_symbol: ' '}
      - {click: '—'}
      - {click: '×'}
      - {click: '〇'}
      - {click: '／'}
      - {click: '＼'}
      - {click: '％'}
      - {click: '﹏'}
      - {click: BackSpace, width: 15,
         key_back_color: fn_back_color, key_text_color: fn_text_color}
      # 行 5：底行（123 回數字鍵盤；空白鍵顯示頁面身份）
      - {click: goto_number, width: 15, key_back_color: fn_back_color, key_text_color: fn_text_color}
      - {click: space_cjk, width: 70,
         key_back_color: space_back_color, key_text_color: space_text_color}
      - {click: Return, width: 15, label_symbol: ' ',
         key_back_color: accent_fill, key_text_color: accent_text,
         hilited_key_back_color: accent_fill_hl, hilited_key_text_color: accent_text}

  xuma_L:
    name: 徐碼
    author: codelllc09
    # 主鍵盤記住上次語言態（不強制）：reset_ascii_mode false → 用本鍵盤自己的
    # lastAsciiMode，中英切換後回到主鍵盤仍是原語言。ascii_mode 僅作初值。
    ascii_mode: 0
    reset_ascii_mode: false
    width: 10
    height: 38
    label_transform: none            # 字母默認小寫（僅 Shift 生效時大寫）
    lock: true
    keys:
      # ── 主鍵盤只有 4 行（用戶裁定 2026-11-06：多了不行）──
      # 直接打標點只有 3 個：底行 , 。/ （中文態分別出 ，、。、）；其餘標點一律長按，
      # 長按值寫 **ASCII**（Rime 才會按中英狀態換形；寫死 CJK 就永遠是中文）。
      # ── 行 1 ──
      - {click: q, long_click: '1'}   # 長按 → 1
      - {click: w, long_click: '2'}   # 長按 → 2
      - {click: e, long_click: '3'}   # 長按 → 3
      - {click: r, long_click: '4'}   # 長按 → 4
      - {click: t, long_click: '5'}   # 長按 → 5
      - {click: y, long_click: '6'}   # 長按 → 6
      - {click: u, long_click: '7'}   # 長按 → 7
      - {click: i, long_click: '8'}   # 長按 → 8
      - {click: o, long_click: '9'}   # 長按 → 9
      - {click: p, long_click: '0'}   # 長按 → 0
      # ── 行 2 ──
      - {width: 5}
      - {click: a, long_click: tab_key}   # 長按 → Tab
      - {click: s, long_click: select_all}   # 長按 → 全選
      - {click: d, long_click: undo}   # 長按 → 撤銷
      - {click: f, long_click: redo}   # 長按 → 重做
      - {click: g, long_click: '('}   # 長按 → （
      - {click: h, long_click: ')'}   # 長按 → ）
      - {click: j, long_click: '^'}   # 長按 → ……
      - {click: k, long_click: '_'}   # 長按 → ——
      - {click: l, long_click: "'"}   # 長按 → ‘’ 連按交替
      - {width: 5}
      # ── 行 3 ──
      - {click: Shift_L, width: 15, key_text_size: 15,
         key_back_color: fn_back_color, key_text_color: fn_text_color}
      - {click: z, long_click: grave_lead}
      - {click: x, long_click: cut}
      - {click: c, long_click: copy}
      - {click: v, long_click: paste}
      - {click: b, long_click: clipboard_panel}
      - {click: n, long_click: ':'}   # 長按 → ：
      - {click: m, long_click: '"'}   # 長按 → “” 連按交替
      - {click: BackSpace, width: 15,
         key_back_color: fn_back_color, key_text_color: fn_text_color}
      # ── 行 4：底行（僅 , . / 三個直接標點；長按給最常用的 ？！ ）──
      # 12# 在左、地球在右（與 Gboard 等主流一致）；兩者等寬 10 單位。
      - {click: sym, long_click: schema_menu,
         key_back_color: fn_back_color, key_text_color: fn_text_color}
      - {click: Mode_switch, long_click: theme_menu, width: 10,
         label_symbol: ' ',
         key_back_color: globe_img, hilited_key_back_color: globe_hl_back_color}
      - {click: ',', long_click: ';'}    # 中文 ，；長按 → ；    # 中文：，／長按 ？
      - {click: space_zh, ascii: space_en, width: 35, key_text_size: 13,
         key_back_color: space_back_color, key_text_color: space_text_color}
      - {click: '.', long_click: '!'}    # 中文 。；長按 → ！    # 中文：。／長按 ！
      # 斜線：**送 ASCII `/`**（送給 Rime，由 punctuator 給 、/／÷ 候選）。
      # 用戶裁定（2026-11-06）：接受「打 、 要按兩下」的老樣子——因為一旦改成直出 、，
      # /menu /add /time 等 lua 命令就再也打不出來了（中文態打不出 /；英文態不走 processor）。
      - {click: '/', long_click: '?',      # 長按 → ？
         key_back_color: fn_back_color, key_text_color: fn_text_color}
      - {click: Return, composing: Return1, long_click: CommitComment, width: 15,
         label_symbol: ' ',
         key_back_color: accent_fill, key_text_color: accent_text,
         hilited_key_back_color: accent_fill_hl, hilited_key_text_color: accent_text}

